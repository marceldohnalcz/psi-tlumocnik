name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Unit testy
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Keystore ze secretů
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Hlídač podpisu
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning::Chybí secrets s podepisovacím klíčem – APK se do vydání nenahraje (testovací podpis by nešel nainstalovat přes ostrou verzi)." 

      - name: Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Přejmenovat APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "psi-tlumocnik-$VERSION.apk"
          echo "APK=psi-tlumocnik-$VERSION.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: psi-tlumocnik-apk
          path: ${{ env.APK }}

      - name: GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != '' }}
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
